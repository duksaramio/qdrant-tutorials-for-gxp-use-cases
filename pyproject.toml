[project]
name = "qdrant-tutorials-for-gxp-use-cases"
version = "0.1.0"
description = "Qdrant vector search tutorials tailored for Life Sciences Quality, CSV, GxP, and 21 CFR Part 11 use cases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.11.0",
    "fastembed>=0.4.0",
    "ollama>=0.6.0",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyterlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
